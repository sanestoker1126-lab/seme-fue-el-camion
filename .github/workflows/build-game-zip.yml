name: Empaquetar juego V57
on:
  push:
    branches:
      - "feature/toxifamilia-v57-villains-qa"
  workflow_dispatch:
jobs:
  zip:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Código y assets del juego
        uses: actions/checkout@v4
      - name: Empaquetar juego completo para Web/PC/Android
        run: |
          mkdir -p dist/Se_Me_Fue_El_Camion_V57
          rsync -a --exclude '.git' --exclude '.github' --exclude 'dist' --exclude '__pycache__' ./ dist/Se_Me_Fue_El_Camion_V57/
          cd dist
          zip -q -r ../Se_Me_Fue_El_Camion_V57_COMPLETO.zip Se_Me_Fue_El_Camion_V57
          cd ..
          unzip -tq Se_Me_Fue_El_Camion_V57_COMPLETO.zip
          test -f dist/Se_Me_Fue_El_Camion_V57/Se_Me_Fue_El_Camion.html
          test -f dist/Se_Me_Fue_El_Camion_V57/js/app/main.js
          test -f dist/Se_Me_Fue_El_Camion_V57/assets/scenes/generated/submarino_fondo.png
          du -h Se_Me_Fue_El_Camion_V57_COMPLETO.zip
      - name: Descargar juego
        uses: actions/upload-artifact@v4
        with:
          name: Se_Me_Fue_El_Camion_V57_COMPLETO
          path: Se_Me_Fue_El_Camion_V57_COMPLETO.zip
          retention-days: 30
          compression-level: 0
