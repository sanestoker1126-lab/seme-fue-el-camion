name: Empaquetar juego completo
# Arma el ZIP jugable (Web/PC/Android) con solo los archivos que usa el juego: sin pruebas, herramientas,
# documentación ni assets retirados. Se lanza a mano (Actions → Run workflow) o al publicar una etiqueta v*.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
jobs:
  zip:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Código y assets del juego
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Versión del juego
        id: ver
        run: echo "v=$(node -e "require('./js/core/util.js');require('./js/core/config.js');console.log(globalThis.CAMION.CONFIG.version)")" >> "$GITHUB_OUTPUT"
      - name: Empaquetar
        run: |
          bash tools/empaquetar.sh "${{ steps.ver.outputs.v }}"
          unzip -tq "Se_Me_Fue_El_Camion_V${{ steps.ver.outputs.v }}.zip"
          du -h "Se_Me_Fue_El_Camion_V${{ steps.ver.outputs.v }}.zip"
      - name: Descargar juego
        uses: actions/upload-artifact@v4
        with:
          name: Se_Me_Fue_El_Camion_V${{ steps.ver.outputs.v }}
          path: Se_Me_Fue_El_Camion_V${{ steps.ver.outputs.v }}.zip
          retention-days: 30
          compression-level: 0
