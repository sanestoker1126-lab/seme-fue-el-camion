name: QA videojuego
on:
  push:
    branches: ["feature/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Revisar sintaxis de JavaScript
        run: |
          for file in js/core/*.js js/app/*.js; do
            node --check "$file"
          done
      - name: Pruebas del motor y niveles
        run: node --test tests/*.test.js
      # Los índices 16 y 17 no son posiciones válidas de LEVEL_SEQUENCE;
      # las misiones especiales se verifican por sus definiciones reales en v53/v57.
      - name: Validar enemigos y mapas submarino/espacial
        run: node --test tests/v53.test.js tests/v54.test.js tests/v57_thematic_villains.test.js
